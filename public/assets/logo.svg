<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  
  <!-- Icon background glow -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="url(#glow-grad)" filter="url(#blur-filter)"/>
  
  <!-- Icon Box -->
  <rect x="8" y="8" width="32" height="32" rx="8" fill="#0D1527" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  
  <!-- Financial AI Nodes / Shield Shape -->
  <path d="M24 14L32 18V24C32 28.5 28.5 32.5 24 34C19.5 32.5 16 28.5 16 24V18L24 14Z" fill="url(#logo-grad)" opacity="0.15"/>
  <path d="M24 14L32 18V24C32 28.5 28.5 32.5 24 34C19.5 32.5 16 28.5 16 24V18L24 14Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Growth Trend Pulse line -->
  <path d="M20 25L23 22L25 24L28 19" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="19" r="1.5" fill="#34D399"/>

  <!-- Brand Typography -->
  <text x="48" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3">ELEVATE</text>
  <text x="117" y="24" fill="#10B981" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3">BFSI</text>
  <text x="48" y="36" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="500" font-size="9" letter-spacing="0.8">AI LOAN ELIGIBILITY PLATFORM</text>
</svg>
